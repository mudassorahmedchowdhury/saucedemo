name: CI
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: browser-actions/setup-chrome@v1
      - run: python -m pip install --upgrade pip
      - run: pip install -r sauce-automation-test/requirements.txt
      - run: pytest sauce-automation-test/tests -v --headless --browser chrome --html=sauce-automation-test/reports/report.html --self-contained-html